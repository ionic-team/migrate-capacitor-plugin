name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the engines floor, matching the Capacitor 9 CLI. It also covers what
        # `npm test` needs: `node --test` globs and unflagged TypeScript type stripping.
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # package-lock.json is gitignored, so `npm ci` is not available here.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
